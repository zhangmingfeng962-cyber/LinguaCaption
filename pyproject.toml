[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linguacaption"
version = "0.1.0"
description = "Local-first bilingual captions over desktop video"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<7", "numpy>=1.26,<3", "faster-whisper>=1.2,<2",
  "ctranslate2>=4.6,<5", "sentencepiece>=0.2,<0.3", "av>=14,<18",
  "webrtcvad-wheels>=2.0.14,<3", "regex>=2024.11",
  "SoundCard>=0.4.5,<0.5; sys_platform == 'win32'",
  "pynput>=1.8,<2; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11", "pyinstaller>=6.12,<7"]
prepare = ["transformers>=4.48,<5", "torch>=2.6", "huggingface-hub>=0.27"]

[project.scripts]
linguacaption = "linguacaption.app:main"

[project.urls]
Homepage = "https://github.com/zhangmingfeng962-cyber/LinguaCaption"
Issues = "https://github.com/zhangmingfeng962-cyber/LinguaCaption/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linguacaption = ["native/macos/*.swift", "native/macos/*.plist", "native/macos/AudioCapture.app/Contents/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
